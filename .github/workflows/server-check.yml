name: Check server access

on:
  push:
    branches: [main]
    paths: ['.github/workflows/server-check.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare runtime and inspect site configuration
        uses: appleboy/ssh-action@v1.0.3
        env:
          MYAKA_SUDO_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: MYAKA_SUDO_PASSWORD
          timeout: 30s
          command_timeout: 5m
          script: |
            set -eu
            as_root() {
              if [ "$(id -u)" -eq 0 ]; then
                "$@"
              else
                printf '%s\n' "$MYAKA_SUDO_PASSWORD" | sudo -S -p '' -- "$@"
              fi
            }
            as_root true
            as_root install -d -o "$(id -u)" -g "$(id -g)" -m 0755 /var/www/myaka
            MYAKA_BUN_ROOT="$HOME/.local/share/myaka/bun"
            export PATH="$MYAKA_BUN_ROOT/bin:$HOME/.bun/bin:$PATH"
            if [ ! -x "$MYAKA_BUN_ROOT/bin/bun" ]; then
              mkdir -p "$HOME/.cache/myaka"
              curl -fsSL --connect-timeout 15 --max-time 120 https://bun.com/install -o "$HOME/.cache/myaka/install-bun.sh"
              BUN_INSTALL="$MYAKA_BUN_ROOT" bash "$HOME/.cache/myaka/install-bun.sh" bun-v1.4.2
            fi
            bun --version
            node --version
            pm2 --version
            printf 'myaka_nginx_config_files:\n'
            as_root grep -RIl --include='*' 'myaka\.rumiscola\.ru' /etc/nginx/sites-enabled /etc/nginx/conf.d || true
            printf 'myaka_existing_cert:\n'
            if as_root test -f /etc/letsencrypt/live/myaka.rumiscola.ru/fullchain.pem; then
              as_root openssl x509 -in /etc/letsencrypt/live/myaka.rumiscola.ru/fullchain.pem -noout -dates -issuer -subject
            else
              printf 'absent\n'
            fi
            printf 'ssh_host_fingerprints:\n'
            for key in /etc/ssh/ssh_host_*_key.pub; do
              ssh-keygen -E sha256 -lf "$key"
            done
            printf 'myaka_pm2_process:\n'
            pm2 describe myaka 2>/dev/null || true
            printf 'myaka_port_state:\n'
            ss -ltn '( sport = :2027 )' 2>/dev/null || true
