name: Deploy Myaka to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: myaka-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_DIR: ${{ vars.APP_DIR || '/var/www/myaka' }}
      APP_PORT: ${{ vars.APP_PORT || '2027' }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://myaka.rumiscola.ru' }}
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check TypeScript
        run: bun run typecheck

      - name: Build frontend
        run: bun run build

      - name: Check chat integration
        run: bun run test:chat

      - name: Prepare deploy.zip
        run: bun run package:deploy

      - name: Save deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: myaka-deploy-${{ github.run_id }}
          path: deploy.zip
          retention-days: 14

      - name: Check server configuration
        id: server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APP_DIR" =~ ^/[a-zA-Z0-9/_-]+$ && "$APP_DIR" != / ]]
          [[ "$APP_PORT" =~ ^[0-9]{1,5}$ ]] && ((10#$APP_PORT >= 1 && 10#$APP_PORT <= 65535))
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && ((10#$SSH_PORT >= 1 && 10#$SSH_PORT <= 65535))
          if [[ -n "$SSH_HOST" && -n "$SSH_USER" && -n "$SSH_KEY" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Build completed. Configure SSH_HOST, SSH_USER and SSH_KEY to enable server deployment.'
            echo '### Server deployment is not configured' >> "$GITHUB_STEP_SUMMARY"
            echo 'The build and deploy.zip are ready. Add SSH_HOST, SSH_USER, SSH_KEY and, if needed, SSH_PORT in repository Actions secrets, then run this workflow again.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload deploy.zip to server
        if: steps.server.outputs.ready == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          source: deploy.zip
          target: ${{ env.APP_DIR }}/incoming/${{ env.RELEASE_ID }}/

      - name: Deploy on server with PM2
        if: steps.server.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          MYAKA_SUDO_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          command_timeout: 10m
          envs: APP_DIR,APP_PORT,RELEASE_ID,MYAKA_SUDO_PASSWORD
          script: |
            set -eu
            export PATH="$HOME/.local/share/myaka/bun/bin:$HOME/.bun/bin:$PATH"
            BUNDLE_DIR="$APP_DIR/incoming/$RELEASE_ID"
            unzip -q -o "$BUNDLE_DIR/deploy.zip" -d "$BUNDLE_DIR"
            bash "$BUNDLE_DIR/deploy/ops/deploy-server.sh" "$BUNDLE_DIR/deploy"
            if [ "$(id -u)" -eq 0 ]; then
              APP_PORT="$APP_PORT" bash "$APP_DIR/current/ops/configure-nginx.sh"
            else
              printf '%s\n' "$MYAKA_SUDO_PASSWORD" | sudo -S -p '' -- env APP_PORT="$APP_PORT" bash "$APP_DIR/current/ops/configure-nginx.sh"
            fi
            rm -rf "$BUNDLE_DIR"

      - name: Check public HTTPS site
        if: steps.server.outputs.ready == 'true'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 3 --connect-timeout 15 --max-time 30 "$NEXT_PUBLIC_SITE_URL/" -o /tmp/myaka-home.html
          test -s /tmp/myaka-home.html
          grep -q '<title>Мяка' /tmp/myaka-home.html
          grep -q 'property="og:image"' /tmp/myaka-home.html
          grep -q 'myaka-preview.jpg' /tmp/myaka-home.html
          curl --fail --silent --show-error --connect-timeout 15 --max-time 30 "$NEXT_PUBLIC_SITE_URL/images/myaka-preview.jpg" -o /tmp/myaka-preview.jpg
          test -s /tmp/myaka-preview.jpg
          curl --fail --silent --show-error --connect-timeout 15 --max-time 30 "$NEXT_PUBLIC_SITE_URL/robots.txt"
          curl --fail --silent --show-error --connect-timeout 15 --max-time 30 "$NEXT_PUBLIC_SITE_URL/sitemap.xml"
          echo "Site is available over HTTPS: $NEXT_PUBLIC_SITE_URL" >> "$GITHUB_STEP_SUMMARY"
